<style>
:root{
  --g-research:linear-gradient(135deg,#4facfe,#00f2fe,#43e97b);
  --g-image:linear-gradient(135deg,#fa709a,#fee140,#f6d365);
  --g-video:linear-gradient(135deg,#a8edea,#fed6e3,#d299c2);
  --g-multi:linear-gradient(135deg,#667eea,#764ba2,#f093fb);
  --g-rainbow:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3,#54a0ff,#5f27cd,#ff6b6b);
  --g-primary:linear-gradient(135deg,#667eea,#764ba2);
  --bg:#f0f4ff;--card:rgba(255,255,255,.88);--text:#1e293b;--muted:#64748b;--border:rgba(102,126,234,.15);--active:var(--g-research);
  --glow-purple:0 0 20px rgba(102,126,234,.4);
}
[data-theme="dark"]{--bg:#0a0a14;--card:rgba(25,25,45,.92);--text:#fff;--muted:#a0a0c0;--border:rgba(255,255,255,.1);--glow-purple:0 0 25px rgba(102,126,234,.6)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 20%,rgba(79,172,254,.15) 0%,transparent 40%),radial-gradient(circle at 80% 20%,rgba(250,112,154,.15) 0%,transparent 40%),radial-gradient(circle at 20% 80%,rgba(67,233,123,.12) 0%,transparent 40%),radial-gradient(circle at 80% 80%,rgba(118,75,162,.15) 0%,transparent 40%);animation:bgShift 20s ease-in-out infinite alternate}
@keyframes bgShift{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(20deg)}100%{filter:hue-rotate(-10deg)}}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.35;z-index:-1;animation:floatBlob 15s ease-in-out infinite}
.blob1{width:250px;height:250px;background:linear-gradient(135deg,#4facfe,#00f2fe);top:-50px;left:-50px}
.blob2{width:200px;height:200px;background:linear-gradient(135deg,#fa709a,#fee140);top:40%;right:-60px;animation-delay:3s}
.blob3{width:220px;height:220px;background:linear-gradient(135deg,#43e97b,#38f9d7);bottom:-40px;left:20%;animation-delay:6s}
.blob4{width:180px;height:180px;background:linear-gradient(135deg,#764ba2,#f093fb);top:20%;left:60%;animation-delay:9s}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-30px) scale(1.1)}50%{transform:translate(-20px,20px) scale(.95)}75%{transform:translate(20px,30px) scale(1.05)}}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);backdrop-filter:blur(20px);position:relative;z-index:10}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--g-rainbow);background-size:300% 100%;animation:rainbowFlow 4s linear infinite}
@keyframes rainbowFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
header h1{font-size:22px;font-weight:900;background:var(--g-rainbow);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowText 6s linear infinite}
@keyframes rainbowText{0%{background-position:0% 50%}100%{background-position:300% 50%}}
header p{font-size:10px;color:var(--muted);margin-top:2px}
.hbtns{display:flex;gap:8px}
.hbtns button{border:none;width:40px;height:40px;border-radius:14px;background:var(--card);font-size:17px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.1);transition:all .3s}
.hbtns button:active{transform:scale(.9) rotate(5deg)}
.tabs{display:flex;gap:8px;padding:12px 12px 6px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 16px;border:none;border-radius:999px;background:var(--card);color:var(--text);font-weight:700;font-size:13px;transition:all .4s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tab::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transition:left .6s}
.tab:hover::before{left:100%}
.tab.active{background:var(--active);color:#fff;transform:scale(1.08) translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.2),var(--glow-purple);animation:tabPulse 2s ease-in-out infinite}
@keyframes tabPulse{0%,100%{box-shadow:0 8px 25px rgba(0,0,0,.2),0 0 20px rgba(102,126,234,.4)}50%{box-shadow:0 8px 30px rgba(0,0,0,.25),0 0 35px rgba(102,126,234,.6)}}
.panel{display:none;padding:10px 14px;gap:10px;flex-wrap:wrap;background:var(--card);backdrop-filter:blur(10px);margin:8px 12px;border-radius:18px;font-size:12px;border:1px solid var(--border);position:relative;z-index:5}
.panel.show{display:flex;animation:panelSlide .4s cubic-bezier(.4,0,.2,1)}
@keyframes panelSlide{from{opacity:0;transform:translateY(-15px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel label{display:flex;align-items:center;gap:6px;font-weight:600}
.panel select{border:2px solid var(--border);border-radius:10px;padding:5px 8px;background:transparent;color:var(--text);font-weight:600}
.panel input[type=range]{accent-color:#667eea}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:5}
.msg{max-width:82%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;animation:msgPop .4s cubic-bezier(.4,0,.2,1)}
@keyframes msgPop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.user{align-self:flex-end;background:var(--active);color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15),var(--glow-purple)}
.msg.ai{align-self:flex-start;background:var(--card);backdrop-filter:blur(15px);border:1px solid var(--border);border-bottom-left-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.08);position:relative;overflow:hidden}
.msg.ai::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--g-rainbow);background-size:300% 100%;animation:rainbowFlow 5s linear infinite}
.msg img,.msg video,.msg canvas{max-width:100%;border-radius:14px;margin-top:8px;display:block;box-shadow:0 8px 25px rgba(0,0,0,.15)}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.actions button{border:none;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.15);transition:all .3s}
.actions button:active{transform:scale(.92)}
.actions button:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.2)}
.a-dl{background:linear-gradient(135deg,#667eea,#764ba2,#f093fb)}
.a-tts{background:linear-gradient(135deg,#4facfe,#00f2fe,#43e97b)}
.a-pdf{background:linear-gradient(135deg,#fa709a,#fee140,#f6d365)}

.a-apply{background:linear-gradient(135deg,#ff6b6b,#feca57,#ff9ff3)}
#toolsGrid{display:none;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;overflow-y:auto;flex:1;position:relative;z-index:5}
#toolsGrid.show{display:grid;animation:gridFade .5s}
@keyframes gridFade{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.tool{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:18px;padding:14px 8px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;transition:all .3s}
.tool:hover,.tool:active{transform:translateY(-5px) scale(1.02);box-shadow:0 12px 30px rgba(0,0,0,.12)}
.tool span{font-size:26px;display:block;margin-bottom:6px;animation:iconBounce 3s ease-in-out infinite}
@keyframes iconBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.inputbar{padding:12px;background:var(--card);backdrop-filter:blur(20px);position:relative;z-index:10;border-top:1px solid var(--border)}
.inputbar::before{content:'';position:absolute;top:-2px;left:0;right:0;height:2px;background:var(--g-rainbow);background-size:300% 100%;animation:rainbowFlow 4s linear infinite}
.inputbar .row{display:flex;gap:10px;align-items:center}
.inputbar button{border:none;width:46px;height:46px;border-radius:50%;font-size:18px;background:linear-gradient(135deg,rgba(102,126,234,.15),rgba(118,75,162,.15));color:#667eea;flex:0 0 auto;cursor:pointer;transition:all .3s}
.inputbar button:active{transform:scale(.85) rotate(-10deg)}
#sendBtn{background:var(--active);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2),var(--glow-purple)}
#micBtn.rec{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 15px rgba(239,68,68,0)}}
#textInput{flex:1;border:2px solid var(--border);border-radius:25px;padding:13px 18px;font-size:14px;outline:none;background:transparent;color:var(--text);transition:all .3s}
#textInput:focus{border-color:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,.15)}
#uploadPreview{width:48px;height:48px;object-fit:cover;border-radius:12px;margin:0 0 8px 12px;display:none;border:3px solid #667eea}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:none;align-items:flex-end;z-index:50}
.sheet.show{display:flex;animation:sheetFade .3s}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
.sheet .box{width:100%;max-height:75%;overflow-y:auto;background:var(--card);backdrop-filter:blur(25px);border-radius:28px 28px 0 0;padding:20px;animation:sheetSlide .4s cubic-bezier(.4,0,.2,1);position:relative}
@keyframes sheetSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--g-rainbow);background-size:300% 100%;animation:rainbowFlow 4s linear infinite}
.sheet h3{margin-bottom:14px;background:var(--g-rainbow);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowText 6s linear infinite}
.sheet .item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
#memSearch{width:100%;padding:12px 16px;border-radius:14px;border:2px solid var(--border);background:transparent;color:var(--text);margin-bottom:12px;font-size:14px}
.memBtns{display:flex;gap:10px;margin-bottom:14px}
.memBtns button{flex:1;border:none;padding:12px;border-radius:14px;color:#fff;font-weight:700;cursor:pointer}
#exportChat{background:linear-gradient(135deg,#667eea,#764ba2,#f093fb)}
#clearChat{background:linear-gradient(135deg,#ef4444,#f97316,#feca57)}
.memItem{padding:12px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;font-size:13px;background:rgba(102,126,234,.05)}
.memItem .time{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--g-rainbow);background-size:300% 100%;color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;z-index:99;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90%;animation:rainbowFlow 3s linear infinite}
#toast.show{display:block;animation:toastPop .4s cubic-bezier(.4,0,.2,1),rainbowFlow 3s linear infinite}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.8)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.confetti{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:98}
.skeleton{background:linear-gradient(90deg,rgba(102,126,234,.1) 25%,rgba(250,112,154,.15) 37%,rgba(67,233,123,.1) 50%,rgba(254,225,64,.15) 63%,rgba(118,75,162,.1) 75%);background-size:400% 100%;animation:shim 1.5s infinite;border-radius:14px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#667eea,#764ba2);border-radius:10px}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s);
const chat=$('#chat'),input=$('#textInput');
let mode='research',lang='English',safeModeOn=false,pendingImages=[];
const MODE_COLORS={research:'var(--g-research)',image:'var(--g-image)',video:'var(--g-video)',multi:'var(--g-multi)',palette:'var(--g-rainbow)',tools:'var(--g-primary)'};
let mem={history:[]};
try{mem=JSON.parse(localStorage.getItem('sm_mem'))||{history:[]};}catch(e){mem={history:[]};}
if(!Array.isArray(mem.history))mem.history=[];

const BLOCKED={violence:['kill','weapon','bomb'],hate:['racist','sexist'],illegal:['hack','steal','fraud','malware'],nsfw:['nude','porn'],selfharm:['suicide','self-harm']};
const SAFE_MSG={violence:"DEAR BOSS, violence allowed nahi hai! 🌟",hate:"DEAR BOSS, kindness & respect! 💙",illegal:"DEAR BOSS, illegal help nahi! 🔒",nsfw:"DEAR BOSS, family-friendly! 🌈",selfharm:"DEAR BOSS, aap important ho! Helpline:1800-599-0019 💙"};
function scan(t){const l=(t||'').toLowerCase();for(const c in BLOCKED){if(BLOCKED[c].some(k=>l.includes(k)))return SAFE_MSG[c];}if(/ignore (previous|all|prior) instructions|jailbreak|dan mode/i.test(l))return 'DEAR BOSS, safety change nahi ho sakti! 🛡️';if(safeModeOn){const ex=['alcohol','gambling'];if(ex.some(k=>l.includes(k)))return 'DEAR BOSS, Safe Mode me ye allowed nahi! 🛡️';}return null;}
const RL={t:[],allow(){const n=Date.now();this.t=this.t.filter(x=>n-x<60000);if(this.t.length>=10)return false;this.t.push(n);return true;}};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2500);}
function confetti(){const cs=['#667eea','#fa709a','#fee140','#4facfe','#00f2fe','#ff6b6b'];for(let i=0;i<35;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.top='-10px';p.style.background=cs[i%6];document.body.appendChild(p);let y=0,vx=(Math.random()-.5)*4,vy=2+Math.random()*3;(function f(){y+=vy;p.style.top=y+'px';p.style.opacity=1-y/innerHeight;if(y<innerHeight)requestAnimationFrame(f);else p.remove();})();}}
function bubble(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

async function dl(url,name){toast('⬇️ Downloading '+name+'...');if(url.startsWith('data:')||url.startsWith('blob:')){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('✅ Saved, DEAR BOSS!');confetti();return;}try{const r=await fetch(url);if(!r.ok)throw 0;const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('✅ Saved!');confetti();}catch(e){window.open(url,'_blank');toast('📂 Browser me khula');}}
function dlText(text,name){const b=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('✅ Saved '+name);confetti();}
function downloadImage(img,url,name){try{const c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;c.getContext('2d').drawImage(img,0,0);dl(c.toDataURL('image/jpeg',0.92),name);}catch(e){dl(url,name);}}

function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('📋 Copied!')).catch(()=>fbCopy(t));}else fbCopy(t);}
function fbCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('📋 Copied!');}catch(e){toast('Copy nahi hua');}ta.remove();}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;document.documentElement.style.setProperty('--active',MODE_COLORS[mode]);$('#p-video').classList.toggle('show',mode==='video');$('#p-image').classList.toggle('show',mode==='image');$('#p-palette').classList.toggle('show',mode==='palette');$('#toolsGrid').classList.toggle('show',mode==='tools');chat.style.display=(mode==='tools')?'none':'flex';});

const TOOLS=[['🎨','Logo Maker','image','professional logo, minimal'],['📱','Thumbnail','image','youtube thumbnail, bold'],['😂','Meme','image','funny meme'],['🧑','Avatar','image','cartoon avatar'],['🖼','Wallpaper','image','phone wallpaper 4k'],['🎭','Portrait','image','professional portrait'],['✏️','Sketch→Art','image','sketch to detailed art'],['🌈','Colorize','image','colorized vintage photo'],['📝','Summarizer','research','Summarize:'],['🌐','Translator','research','Translate to English:'],['✍️','Writer','research','Write about:'],['💻','Code Gen','research','Write code for:'],['🧮','Math Solver','research','Solve step by step:'],['❓','Quiz Maker','research','Create quiz about:'],['✅','Fact Check','research','Fact-check:'],['🎓','AI Tutor','research','Teach me about:'],['🎬','Img→Video','video',''],['🧩','Collage','multi',''],['✨','Enhance','multi',''],['🎨','Palette','palette','']];
TOOLS.forEach(([e,n,act,pre])=>{const d=document.createElement('div');d.className='tool';d.innerHTML='<span>'+e+'</span>'+n;d.onclick=()=>{mode=act;document.documentElement.style.setProperty('--active',MODE_COLORS[act]);$('#toolsGrid').classList.remove('show');chat.style.display='flex';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===act));input.value=pre||'';input.focus();toast(e+' '+n+' ready!');};$('#toolsGrid').appendChild(d);});

$('#themeBtn').onclick=()=>{const html=document.documentElement;const isDark=html.dataset.theme==='dark';html.dataset.theme=isDark?'light':'dark';$('#themeBtn').textContent=isDark?'🌙':'☀️';};
$('#lang').onchange=e=>{lang=e.target.value;toast('🌐 Language: '+lang);};
$('#safeMode').onchange=e=>{safeModeOn=e.target.checked;toast(safeModeOn?'🛡️ Safe Mode ON':'Safe Mode OFF');};
$('#setBtn').onclick=()=>$('#setSheet').classList.add('show');
$('#closeSet').onclick=()=>$('#setSheet').classList.remove('show');
$('#wipeBtn').onclick=()=>{if(confirm('DEAR BOSS, sab kuch delete karein?')){localStorage.removeItem('sm_mem');location.reload();}};

function saveMem(){mem.history=mem.history.slice(-50);try{localStorage.setItem('sm_mem',JSON.stringify(mem));}catch(e){}}
function pushMem(r,t){mem.history.push({role:r,text:t,ts:Date.now()});saveMem();}
$('#memBtn').onclick=()=>{renderMem();$('#memSheet').classList.add('show');};
$('#closeMem').onclick=()=>$('#memSheet').classList.remove('show');
$('#memSearch').addEventListener('input',renderMem);
function renderMem(){const q=($('#memSearch').value||'').toLowerCase();const list=mem.history.filter(m=>(m.text||'').toLowerCase().includes(q)).slice(-20).reverse();$('#memList').innerHTML=list.length?list.map(m=>'<div class="memItem"><div class="time">'+(m.role==='user'?'👤':'🤖')+' '+new Date(m.ts).toLocaleTimeString()+'</div>'+esc(m.text)+'</div>').join(''):'<p style="text-align:center;color:var(--muted)">Koi history nahi</p>';}
$('#exportChat').onclick=()=>{if(!mem.history.length)return toast('History khali hai');dlText(mem.history.map(m=>(m.role==='user'?'👤 You':'🤖 SM Godzz')+': '+m.text).join('\n\n'),'SMGodzz_Chat.txt');};
$('#clearChat').onclick=()=>{if(confirm('DEAR BOSS, saari history delete?')){mem.history=[];saveMem();renderMem();toast('🗑️ Cleared!');}};

$('#plusBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').addEventListener('change',e=>{pendingImages=Array.from(e.target.files||[]);if(pendingImages.length){const r=new FileReader();r.onload=()=>{const p=$('#uploadPreview');p.src=r.result;p.style.display='block';};r.readAsDataURL(pendingImages[0]);toast('📎 '+pendingImages.length+' image(s) attached');}});
$('#duration').addEventListener('input',e=>{$('#durLabel').textContent=e.target.value+'s';});

$('#micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('🎤 Voice input yahan supported nahi');try{const r=new SR();r.lang=lang==='English'?'en-IN':'hi-IN';$('#micBtn').classList.add('rec');r.onresult=e=>{input.value+=(e.results[0][0].transcript||'');};r.onend=()=>$('#micBtn').classList.remove('rec');r.onerror=()=>$('#micBtn').classList.remove('rec');r.start();}catch(e){$('#micBtn').classList.remove('rec');}};
function speak(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='English'?'en-IN':'hi-IN';speechSynthesis.speak(u);}catch(e){}}

$('#sendBtn').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
async function send(){const text=input.value.trim();if(!text&&pendingImages.length===0)return toast('Kuch likhein ya image attach karein');const blocked=scan(text);if(blocked){bubble('ai','🛡️ '+blocked);input.value='';return;}if(!RL.allow())return toast('⏳ Thoda rukein, DEAR BOSS!');input.value='';$('#uploadPreview').style.display='none';let uh='';if(text)uh+=esc(text);if(pendingImages.length)uh+=(text?'<br>':'')+'📎 '+pendingImages.length+' image(s)';bubble('user',uh);pushMem('user',text||('[images]'));
try{if(mode==='image')await doImage(text);else if(mode==='video')await doVideo(text);else if(mode==='multi')await doMulti();else if(mode==='palette')await doPalette(text);else await doResearch(text);}catch(e){bubble('ai','⚠️ Kuch galat ho gaya, DEAR BOSS. Dobara try karein.');}
pendingImages=[];$('#fileInput').value='';}

async function doResearch(text){const b=bubble('ai','🔍 Researching, DEAR BOSS...');try{const sys='You are SM Godzz AI. ALWAYS address the user as "DEAR BOSS". Reply in '+lang+'. Give clear step-by-step answers.';let ans='';try{const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:sys},{role:'user',content:text}]})});if(!r.ok)throw 0;const j=await r.json();ans=(j&&j.choices&&j.choices[0]&&j.choices[0].message)?j.choices[0].message.content:'';if(!ans)throw 0;}catch(e){const r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(sys+' User: '+text));ans=await r2.text();}ans=(ans||'').trim()||'Sorry DEAR BOSS, jawab nahi mila. Dobara try karein.';
b.innerHTML=esc(ans)+'<div class="actions"><button class="a-tts">🔊 Listen</button><button class="a-pdf">📄 PDF</button><button class="a-copy">📋 Copy</button><button class="a-dl">⬇️ Download</button></div>';
b.querySelector('.a-tts').onclick=()=>speak(ans);b.querySelector('.a-pdf').onclick=()=>makePDF(text,ans);b.querySelector('.a-copy').onclick=()=>copyText(ans);b.querySelector('.a-dl').onclick=()=>dlText(ans,'SMGodzz_Research.txt');pushMem('ai',ans);confetti();}catch(e){b.textContent='⚠️ Network issue, DEAR BOSS. Internet check karein.';}}
function makePDF(q,a){if(typeof window.jspdf==='undefined'||!window.jspdf.jsPDF)return toast('📄 PDF library load nahi hui');try{const{jsPDF}=window.jspdf;const d=new jsPDF();d.setFontSize(16);d.text('SM Godzz Research Report',14,18);d.setFontSize(9);d.setTextColor(120);d.text('Query: '+(q||'').slice(0,80),14,26);d.setFontSize(11);d.setTextColor(0);let y=34;d.splitTextToSize(a,180).forEach(l=>{if(y>280){d.addPage();y=18;}d.text(l,14,y);y+=6;});d.save('SMGodzz_Report.pdf');toast('📄 PDF saved!');confetti();}catch(e){toast('PDF error');}}

function imgURL(p,w,h){return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width='+w+'&height='+h+'&nologo=true&seed='+Math.floor(Math.random()*1e6);}
async function doImage(text){const b=bubble('ai','<div class="skeleton" style="width:220px;height:220px"></div>');const parts=$('#ratio').value.split('x');const w=parseInt(parts[0])||1024,h=parseInt(parts[1])||1024;const prompt=(text||'beautiful artwork')+', '+$('#style').value+', vibrant, HD';const url=imgURL(prompt,w,h);const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{b.innerHTML='';b.appendChild(img);b.insertAdjacentHTML('beforeend','<div class="actions"><button class="a-dl">⬇️ Download</button></div>');b.querySelector('.a-dl').onclick=()=>downloadImage(img,url,'SMGodzz_Image.jpg');confetti();};img.onerror=()=>{b.textContent='⚠️ Image generate nahi hui, DEAR BOSS. Dobara try karein.';};img.src=url;}

function getSupportedMime(){const t=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];for(let i=0;i<t.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t[i]))return t[i];}return '';}
function loadImg(u){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=u;});}
function drawScene(ctx,img,W,H,p,i){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const cov=Math.max(W/img.width,H/img.height);const z=i%2?1.2-.2*p:1+.2*p;const dw=img.width*cov*z,dh=img.height*cov*z;ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);}
async function doVideo(text){const b=bubble('ai','🎬 Taiyaar ho raha hai, DEAR BOSS...');const canvas=document.createElement('canvas');if(!canvas.captureStream){b.textContent='⚠️ Video feature supported nahi.';return;}const dur=parseInt($('#duration').value)||30;const sizes={480:[854,480],720:[1280,720],1080:[1920,1080]};const W=sizes[$('#quality').value][0],H=sizes[$('#quality').value][1];canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');const sceneCount=Math.max(2,Math.min(8,Math.round(dur/10)));const imgs=[];for(let i=0;i<sceneCount;i++){b.textContent='🎬 Scene '+(i+1)+'/'+sceneCount+' ban raha hai...';try{imgs.push(await loadImg(imgURL((text||'cinematic')+' scene '+(i+1),W,H)));}catch(e){b.textContent='⚠️ Scene fail hua.';return;}}
const stream=canvas.captureStream(30);const AC=window.AudioContext||window.webkitAudioContext;let ac=null,osc=[];if(AC&&$('#autoMusic').checked){try{ac=new AC();if(ac.state==='suspended')ac.resume();const dest=ac.createMediaStreamDestination();const g=ac.createGain();g.gain.value=0.06;g.connect(dest);[220,277.18,329.63].forEach(f=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start();osc.push(o);});if(dest.stream.getAudioTracks().length)stream.addTrack(dest.stream.getAudioTracks()[0]);}catch(e){ac=null;}}
const mime=getSupportedMime();let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);}catch(e){b.textContent='⚠️ Video recording supported nahi.';return;}
const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};const stopped=new Promise(r=>{rec.onstop=r;});b.textContent='🎬 Recording... 0%';rec.start();let lastPct=-1;
await new Promise(res=>{const t0=performance.now();(function frame(){const t=(performance.now()-t0)/1000;if(t>=dur){res();return;}const sd=dur/sceneCount,idx=Math.min(sceneCount-1,Math.floor(t/sd)),p=(t%sd)/sd;drawScene(ctx,imgs[idx],W,H,p,idx);if($('#overlay').checked){ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold '+Math.round(H*0.04)+'px sans-serif';ctx.textAlign='left';ctx.fillText('SM Godzz',16,H-16);ctx.textAlign='right';ctx.fillText('Scene '+(idx+1)+'/'+sceneCount,W-16,H-16);ctx.textAlign='left';}const pct=Math.round((t/dur)*100);if(pct!==lastPct){lastPct=pct;b.textContent='🎬 Recording... '+pct+'%';}requestAnimationFrame(frame);})();});
rec.stop();await stopped;osc.forEach(o=>{try{o.stop();}catch(e){}});if(ac){try{ac.close();}catch(e){}}
const url=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));b.innerHTML='<video src="'+url+'" controls playsinline></video><div class="actions"><button class="a-dl">⬇️ Download</button></div>';b.querySelector('.a-dl').onclick=()=>dl(url,'SMGodzz_Video.webm');confetti();}

function readFile(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});}
async function doMulti(){if(pendingImages.length<2)return toast('📎 Kam se kam 2 images attach karein');const b=bubble('ai','🖼️ Collage ban raha hai...');try{const imgs=[];for(const f of pendingImages)imgs.push(await loadImg(await readFile(f)));const c=document.createElement('canvas');c.width=800;c.height=800;const ctx=c.getContext('2d');const cols=Math.ceil(Math.sqrt(imgs.length)),s=800/cols;imgs.forEach((im,i)=>ctx.drawImage(im,(i%cols)*s,Math.floor(i/cols)*s,s,s));b.innerHTML='';b.appendChild(c);b.insertAdjacentHTML('beforeend','<div class="actions"><button class="a-dl">⬇️ Download</button></div>');b.querySelector('.a-dl').onclick=()=>dl(c.toDataURL('image/png'),'SMGodzz_Collage.png');confetti();}catch(e){b.textContent='⚠️ Collage fail hua.';}}

function extractColors(img){try{const c=document.createElement('canvas');const x=c.getContext('2d');c.width=c.height=50;x.drawImage(img,0,0,50,50);const d=x.getImageData(0,0,50,50).data;const out=[];for(let i=0;i<d.length;i+=400)out.push('#'+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,'0')).join(''));return out.slice(0,5);}catch(e){return [];}}
async function doPalette(text){const b=bubble('ai','🎨 Palette ban raha hai...');let colors=[];if($('#palMode').value==='image'&&pendingImages[0]){colors=extractColors(await loadImg(await readFile(pendingImages[0])));}if(!colors.length)colors=Array.from({length:5},()=> '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'));const html=colors.map(c=>'<span style="display:inline-block;width:40px;height:40px;border-radius:10px;background:'+c+';margin:2px"></span>').join('');
b.innerHTML=html+'<div class="actions"><button class="a-copy">📋 CSS</button><button class="a-dl">🖼️ PNG</button><button class="a-apply">🎨 Apply</button></div>';
b.querySelector('.a-copy').onclick=()=>copyText(':root{'+colors.map((c,i)=>'--c'+(i+1)+':'+c+';').join('')+'}');
b.querySelector('.a-dl').onclick=()=>{const c=document.createElement('canvas');c.width=colors.length*120;c.height=200;const x=c.getContext('2d');colors.forEach((col,i)=>{x.fillStyle=col;x.fillRect(i*120,0,120,200);});dl(c.toDataURL('image/png'),'SMGodzz_Palette.png');};
b.querySelector('.a-apply').onclick=()=>{document.documentElement.style.setProperty('--g-primary','linear-gradient(135deg,'+colors[0]+','+colors[1]+')');toast('🎨 Theme applied!');};confetti();}

bubble('ai','Welcome, DEAR BOSS! 🌟\n\n💬 Research • 🎨 Image • 🎬 Video\n🖼️ Multi • 🎨 Palette • 🧰 Tools\n\nHar result ke neeche ⬇️ Download button!\n\n\nⒸ 2026 SM Godzz. All Rights Reserved.🧠 icon se chat history dekhein!');
